[package]
name = "my_cv_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "my_cv_rust"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "my_cv_rust"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
# Leptos 0.8 (SSR + hydrate)
leptos = { version = "0.8", features = ["serde-lite"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Required by #[wasm_bindgen] when building the lib for WASM (hydrate)
wasm-bindgen = "0.2"
console_error_panic_hook = { version = "0.1", optional = true }

# Cloudflare Workers (for deployment target; use feature "worker" to build for Workers)
worker = { version = "0.7", optional = true }

# Server-only dependencies (enabled by feature "ssr")
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
secrecy = { version = "0.8", features = ["serde"], optional = true }
config = { version = "0.14", default-features = false, features = ["yaml"], optional = true }
dotenvy = { version = "0.15", optional = true }
serde-aux = { version = "4", optional = true }

# Smaller WASM in release (matches start-axum).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
wiremock = "0.6"
fake = { version = "4", features = ["derive"] }
claims = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = ["ssr"]
# Used by cargo-leptos when building the lib for the browser (WASM/hydration).
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook"]
# SSR (server-side rendering): enabled by default and for the bin (matches start-axum).
ssr = [
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:leptos_axum",
  "dep:axum",
  "dep:tokio",
  "dep:tracing-subscriber",
  "dep:reqwest",
  "dep:secrecy",
  "dep:config",
  "dep:dotenvy",
  "dep:serde-aux",
]
# Enable for Cloudflare Workers build (wasm target).
worker = ["dep:worker"]

[package.metadata.leptos]
output-name = "my_cv_rust"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
lib-features = ["hydrate"]
lib-default-features = false
tailwind-input-file = "style/main.css"

